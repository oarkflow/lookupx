<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LookupX — Search Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css?v=15" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' },
          }
        }
      }
    }
  </script>
</head>
<body class="h-full">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#search" aria-label="LookupX home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-copy"><strong>lookupx</strong><small>SEARCH CONSOLE</small></span>
      </a>
      <div class="nav-caption">WORKSPACE</div>
      <nav id="sidebar-nav" aria-label="Main navigation">
        <button data-tab="search" class="nav-btn active" aria-label="Search" title="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.2 4.2"></path></svg><span>Search</span>
        </button>
        <button data-tab="indexes" class="nav-btn" aria-label="Indexes" title="Indexes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"></path></svg><span>Indexes</span>
        </button>
        <button data-tab="integrations" class="nav-btn" aria-label="Integrations" title="Integrations">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 15.5 6 18a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0M15.5 8.5 18 6a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0M8 16l8-8"></path></svg><span>Integrations</span>
        </button>
      </nav>
      <div class="sidebar-bottom">
        <div class="engine-mark"><span class="engine-dot"></span><div><strong>LookupX engine</strong><small>Embedded search service</small></div></div>
        <div class="sidebar-version">LOCAL CONSOLE</div>
      </div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-title"><span class="topbar-kicker">LOOKUPX</span><span class="topbar-divider">/</span><h2 id="page-title">Search</h2></div>
        <div class="topbar-actions">
          <label class="api-label" for="api-base">API endpoint</label>
          <input id="api-base" type="text" value="" placeholder="http://localhost:8089" />
          <button onclick="App.refresh()" class="btn btn-secondary btn-refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"></path><path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"></path></svg><span>Refresh</span></button>
        </div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <script src="app.js?v=15"></script>
</body>
</html>
